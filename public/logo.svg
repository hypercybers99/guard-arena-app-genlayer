<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Shield Shell -->
  <path
    d="M 50 8 C 70 8 86 16 86 34 C 86 58 66 78 50 92 C 34 78 14 58 14 34 C 14 16 30 8 50 8 Z"
    fill="url(#shieldGrad)"
    stroke="#60A5FA"
    stroke-width="2.5"
    filter="url(#shieldShadow)"
  />

  <!-- Inner Bevel Accent -->
  <path
    d="M 50 14 C 66 14 78 20 78 35 C 78 54 62 70 50 82 C 38 70 22 54 22 35 C 22 20 34 14 50 14 Z"
    fill="none"
    stroke="url(#glowGrad)"
    stroke-width="1.5"
    stroke-dasharray="2 1"
  />

  <!-- Padlock Shackle -->
  <path
    d="M 39 42 V 33 C 39 26.9 43.9 22 50 22 C 56.1 22 61 26.9 61 33 V 42"
    fill="none"
    stroke="url(#shackleGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Padlock Plate -->
  <rect
    x="34"
    y="40"
    width="32"
    height="26"
    rx="5"
    fill="#0F172A"
    stroke="#38BDF8"
    stroke-width="2"
  />

  <!-- Keyhole (Circle + Trapezoid Stem) -->
  <circle cx="50" cy="49" r="4.5" fill="#38BDF8" />
  <polygon points="48,49 52,49 53,60 47,60" fill="#38BDF8" />
</svg>
